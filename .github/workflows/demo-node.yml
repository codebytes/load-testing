name: Node demo build and tests
on:
  push:
    branches: [main]
    paths: ['demo/src/**', '.node-version', '.github/workflows/demo-node.yml']
  pull_request:
    branches: [main]
    paths: ['demo/src/**', '.node-version', '.github/workflows/demo-node.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 6
    defaults:
      run:
        working-directory: demo/src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: demo/src/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Test actual database operations against the disposable local service
        run: npm run test:database
        env:
          CONNECTION_STRING: mongodb://127.0.0.1:27017
      - name: Compile the infrastructure template without an Azure login
        run: az bicep build --file demo/infra/main.bicep --outfile "$RUNNER_TEMP/demo-template.json"
        working-directory: ${{ github.workspace }}
